<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2E3E64;
            color: #d1d4d9;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
            font-family: Arial, sans-serif;
        }

        .card {
            background-color:  #fff;
            border: 1px solid #4a4e52;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        #prompt-select {
            width: 100%;
            max-width: 250px;
            padding: 12px 15px;
            background-color: #25282b;
            border: 1px solid #4a4e52;
            border-radius: 5px;
            color: #c7c6c4;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        #prompt-select:focus {
            outline: none;
            border-color: #3f67c0;
        }

        #search-input {
            width: 100%;
            max-width: 500px;
            padding: 12px 15px;
            background-color: #25282b;
            border: 1px solid #4a4e52;
            border-radius: 5px;
            color: #c7c6c4;
            font-size: 14px;
        }

        #search-input:focus {
            outline: none;
            border-color: #3f67c0;
        }

        #search-input::placeholder {
            color: #8a8f98;
        }

        .prompt-container {
            background-color: #fff;
            border: 1px solid #4a4e52;
            border-radius: 8px;
            padding: 30px;
            margin-top: 20px;
            min-height: 300px;
        }

        .prompt-text {
            font-size: 16px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 25px;
            color: #4a4e52;
        }

        .prompt-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            border-top: 1px solid #4a4e52;
            padding-top: 15px;
        }

        .prompt-name {
            font-size: 14px;
            font-weight: 600;
            color: #3f67c0;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .copy-btn {
            background-color: #3f67c0;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .copy-btn:hover {
            background-color: #304fc2;
        }

        .copy-btn:active {
            background-color: #293b75;
        }

        .edit-btn {
            background-color: #509ee3;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .edit-btn:hover {
            background-color: #3078c2;
        }

        .edit-btn:active {
            background-color: #295575;
        }

        .delete-btn {
            background-color: #d32f2f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .delete-btn:hover {
            background-color: #a51a1a;
        }

        .delete-btn:active {
            background-color: #7c1212;
        }

        .add-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 20px auto;
            text-decoration: none;
            text-align:center;
            transition: background-color 0.3s;
        }

        .add-btn:hover {
            background-color: #45a049;
        }

        .add-btn:active {
            background-color: #3d8b40;
        }

        .message {
            background-color: #3f67c0;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        .no-prompt {
            color: #03002e;
            font-size: 15px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .prompt-footer {
                flex-direction: column;
                align-items: stretch;
            }

            .button-group {
                flex-direction: column;
            }

            .copy-btn,
            .edit-btn,
            .delete-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Handy Prompt</h1>

        {% if message %}
            <div class="message">{{ message }}</div>
        {% endif %}

        <div class="card">
            <div class="search-row">
                <select id="prompt-select" onchange="loadSelectedPrompt()">
                    <option value="">Select a Prompt...</option>
                    {% for prompt in prompts %}
                        <option value="{{ prompt.id }}">{{ prompt.name }}</option>
                    {% endfor %}
                </select>
                <input type="text" id="search-input" placeholder="Search Prompt..." oninput="searchPrompt()">
            </div>
        </div>

        <div class="prompt-container">
            <div id="no-prompt-msg" class="no-prompt">Select a prompt or type to search...</div>
            <div id="prompt-display" style="display: none;">
                <div class="prompt-text" id="prompt-text"></div>
                <div class="prompt-footer">
                    <div class="prompt-name" id="prompt-name"></div>
                    <div class="button-group">
                        <button class="copy-btn" onclick="copyPrompt()">Copy</button>
                        <button class="edit-btn" onclick="editPrompt()">Edit</button>
                        <button class="delete-btn" onclick="deletePrompt()">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <a href="{% url 'new_prompt' %}" class="add-btn">Add New Prompt</a>
    </div>

    {% csrf_token %}
    <script>
        const CSRF_TOKEN = "{{ csrf_token }}";

        const prompts = [
            {% for prompt in prompts %}
                {id: {{ prompt.id }}, name: "{{ prompt.name|escapejs }}", content: "{{ prompt.content|escapejs }}"},
            {% endfor %}
        ];

        let currentPromptId = null;

        function loadSelectedPrompt() {
            const select = document.getElementById('prompt-select');
            const selectedId = parseInt(select.value);
            currentPromptId = selectedId;
            displayPrompt(selectedId);
        }

        function searchPrompt() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            if (!searchTerm) {
                document.getElementById('no-prompt-msg').style.display = 'block';
                document.getElementById('prompt-display').style.display = 'none';
                return;
            }

            const found = prompts.find(p =>
                p.name.toLowerCase().includes(searchTerm) ||
                p.content.toLowerCase().includes(searchTerm)
            );

            if (found) {
                currentPromptId = found.id;
                document.getElementById('prompt-select').value = found.id;
                displayPrompt(found.id);
            } else {
                document.getElementById('no-prompt-msg').style.display = 'block';
                document.getElementById('prompt-display').style.display = 'none';
            }
        }

        function displayPrompt(id) {
            const prompt = prompts.find(p => p.id === id);
            if (prompt) {
                document.getElementById('no-prompt-msg').style.display = 'none';
                document.getElementById('prompt-display').style.display = 'block';
                document.getElementById('prompt-text').textContent = prompt.content;
                document.getElementById('prompt-name').textContent = prompt.name;
            } else {
                document.getElementById('no-prompt-msg').style.display = 'block';
                document.getElementById('prompt-display').style.display = 'none';
            }
        }

        function copyPrompt() {
            if (!currentPromptId) return;
            const prompt = prompts.find(p => p.id === currentPromptId);
            if (prompt) {
                navigator.clipboard.writeText(prompt.content).then(() => {
                    const btn = document.querySelector('.copy-btn');
                    const originalText = btn.textContent;
                    btn.textContent = '✓ Copied!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 1500);
                });
            }
        }

        function editPrompt() {
            if (!currentPromptId) return;
            window.location.href = `/edit_prompt/${currentPromptId}/`;
        }

        function deletePrompt() {
            if (!currentPromptId) return;
            if (confirm('Are you sure you want to delete this prompt?')) {
                fetch(`/delete_prompt/${currentPromptId}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': CSRF_TOKEN,
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                }).then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('Failed to delete prompt. Please try again.');
                    }
                }).catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while deleting the prompt.');
                });
            }
        }
    </script>
</body>
</html>
